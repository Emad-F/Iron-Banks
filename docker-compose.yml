services:
  postgres:
    image: postgres:16
    container_name: acid-postgres
    environment:
      POSTGRES_DB: acid_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: iron-banks-dashboard
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: acid_demo
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
